name: Verificar projeto

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verificar sintaxe
        run: python -m compileall -q bot.py detector.py proof_renderer.py timeout_store.py test_timeout_store.py

      - name: Testar banco de dados
        run: python -m unittest -v test_timeout_store.py

      - name: Validar imagem Docker
        run: docker build -t sas-moderation:test .
